<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGCSE Physics Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-2xl bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600/20 border border-indigo-500/30 rounded-2xl">
          <i data-lucide="sparkles" class="w-6 h-6 text-indigo-400"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
            مساعد IGCSE Physics الذكي
          </h1>
          <p class="text-xs text-slate-400">منصة الأسئلة والدعم التعليمي</p>
        </div>
      </div>
      <button onclick="resetKey()" class="text-xs text-slate-500 hover:text-slate-300 underline">
        تغيير المفتاح
      </button>
    </div>

    <div id="outputBox" class="min-h-[200px] max-h-[400px] bg-slate-950/60 border border-slate-800 rounded-2xl p-5 text-slate-200 leading-relaxed overflow-y-auto">
      <div class="flex flex-col items-center justify-center h-40 text-slate-500">
        <i data-lucide="sparkles" class="w-10 h-10 mb-2 text-slate-700 animate-pulse"></i>
        <p class="text-sm">اكتب سؤالك في الفيزياء أدناه للبدء...</p>
      </div>
    </div>

    <div class="flex gap-2">
      <input
        type="text"
        id="userInput"
        placeholder="اكتب سؤالك هنا..."
        onkeydown="if(event.key === 'Enter') sendToGemini()"
        class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition text-sm shadow-inner"
      />
      <button
        onclick="sendToGemini()"
        id="sendBtn"
        class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 rounded-2xl transition flex items-center justify-center font-medium gap-2 shadow-lg shadow-indigo-600/20"
      >
        <span>إرسال</span>
        <i data-lucide="send" class="w-4 h-4 transform rotate-180"></i>
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function getApiKey() {
      let key = localStorage.getItem('gemini_api_key');
      if (!key) {
        key = prompt('يرجى إدخال مفتاح Gemini API الخاص بك مرة واحدة ليتم حفظه في متصفحك:');
        if (key) {
          localStorage.setItem('gemini_api_key', key.trim());
        }
      }
      return key;
    }

    function resetKey() {
      localStorage.removeItem('gemini_api_key');
      alert('تم مسح المفتاح. قم بتحديث الصفحة لإدخال مفتاح جديد.');
    }

    async function sendToGemini() {
      const apiKey = getApiKey();
      if (!apiKey) {
        alert('مطلوب إدخال المفتاح للتشغيل');
        return;
      }

      const inputField = document.getElementById("userInput");
      const outputBox = document.getElementById("outputBox");
      const sendBtn = document.getElementById("sendBtn");
      const prompt = inputField.value.trim();

      if (!prompt) return;

      sendBtn.disabled = true;
      outputBox.innerHTML = `
        <div class="flex flex-col items-center justify-center h-40 text-indigo-400 gap-2">
          <div class="animate-spin rounded-full h-7 w-7 border-b-2 border-indigo-400"></div>
          <span class="text-sm text-slate-400">جاري معالجة الإجابة...</span>
        </div>
      `;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "أنت معلم متخصص في منهج IGCSE Physics. أجب بدقة وبأسلوب تعليمي: " + prompt }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          const replyText = data.candidates[0].content.parts[0].text;
          outputBox.innerHTML = `
            <span class="inline-block text-xs font-semibold px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-md border border-indigo-500/20 mb-3">إجابة المعلم:</span>
            <p class="whitespace-pre-wrap text-slate-300 leading-relaxed">${replyText}</p>
          `;
        } else {
          outputBox.innerHTML = `<p class="text-red-400 text-center">حدث خطأ في مفتاح API. اضغط على 'تغيير المفتاح' في الأعلى لإعادة إدخاله.</p>`;
        }
      } catch (error) {
        outputBox.innerHTML = `<p class="text-red-400 text-center">تعذر الاتصال. تحقق من الشبكة.</p>`;
      } finally {
        sendBtn.disabled = false;
        inputField.value = "";
      }
    }
  </script>
</body>
</html>
